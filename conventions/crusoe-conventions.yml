collection_envelope:
  shape: '{ "items": [ ... ] }'
  note: List responses wrap results in an items array rather than returning a bare JSON array.
async_operations:
  supported: true
  model: >-
    Long-running create/update/delete calls on VMs, disks, snapshots, custom images, load balancers,
    VPC resources, Kubernetes clusters and node pools, and Slurm clusters return an Operation object
    (HTTP 200/202) rather than the finished resource. The caller polls the matching *Operation endpoint
    until the operation reaches a terminal state.
  operation_endpoints:
  - getComputeVMsInstancesOperation
  - getStorageDisksOperation
  - getStorageSnapshotsOperation
  - getCustomImagesOperation
  - getKubernetesClustersOperation
  - getKubernetesNodePoolsOperation
  - getSlurmClusterOperation
  - getSlurmNodesetOperation
  - getExternalLoadBalancerOperation
  - getNetworkingLoadBalancersOperation
  - getNetworkingVPCNetworksOperation
  - getNetworkingVPCSubnetsOperation
  - getNetworkingVPCFirewallRulesOperation
  - getAutoClusterOperation
  response_schema: AsyncOperationResponse
  operation_id_param: operation_id (path)
scoping:
  primary: project_id
  detail: >-
    175 of 232 operations carry a project_id path parameter; 16 carry organization_id and 12 carry
    org_id. Projects sit inside organizations, and a default project is configured once in the CLI /
    MCP profile.
error_envelope:
  format: custom
  rfc9457: false
  shape: '{ "code": "<http status as string>", "message": "<snake_case reason>" }'
