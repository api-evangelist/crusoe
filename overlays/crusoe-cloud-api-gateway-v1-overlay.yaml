- target: $
  description: >-
    Declare the security schemes the API actually requires. The published Swagger document declares NO
    securityDefinitions and NO global security, yet 221 of 232 operations return a 401. Without this,
    no generated client or agent can authenticate from the contract alone. Modelled from
    https://docs.crusoecloud.com/reference/api/.
  update:
    securityDefinitions:
      CrusoeSignedRequest:
        type: apiKey
        name: Authorization
        in: header
        description: >-
          Bearer <version:access_key_id:base64_encoded_signature>. The signature is an HMAC-SHA256 over
          http_path, canonicalized_query_params, http_verb and the X-Crusoe-Timestamp value, joined by
          newlines, keyed with the raw-urlsafe-base64-decoded secret key, then base64 encoded. Signature
          version is 1.0. Must be sent together with an X-Crusoe-Timestamp RFC 3339 header.
        x-apievangelist-note: >-
          Modelled by API Evangelist from Crusoe's published API reference — this is NOT a provider
          declaration. Crusoe should publish it in their own spec.
        x-signature-version: '1.0'
        x-companion-header: X-Crusoe-Timestamp
        x-docs: https://docs.crusoecloud.com/reference/api/
    security:
    - CrusoeSignedRequest: []
