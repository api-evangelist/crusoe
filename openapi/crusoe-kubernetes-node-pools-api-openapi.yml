    KubernetesNodeTaint:
      description: 'A taint allows a node to repel a set of pods unless those pods

        tolerate the taint. Taints follow standard Kubernetes semantics

        (see https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).'
      properties:
        effect:
          description: 'Taint effect, controlling how pods are treated on

            matching nodes:

            NoSchedule: new pods are not scheduled unless they tolerate.

            PreferNoSchedule: new pods avoid the node if possible.

            NoExecute: new pods are not scheduled AND existing non-tolerating

            pods are evicted.'
          enum:
          - NoSchedule
          - PreferNoSchedule
          - NoExecute
          example: NoSchedule
          type: string
          x-go-name: Effect
        key:
          description: 'Taint key. Follows the Kubernetes qualified-name

            format: an optional DNS subdomain prefix (up to 253 characters)

            followed by a ''/'', then a name segment (up to 63 characters).

            Allowed characters: alphanumerics, ''-'', ''_'', and ''.''. Must start

            and end with an alphanumeric character.

            Keys beginning with "crusoe.ai/" are reserved for internal use.'
          example: gpu-type
          type: string
          x-go-name: Key
        value:
          description: 'Taint value. May be empty. Follows the same format

            rules as a Kubernetes label value: up to 63 characters, alphanumerics

            and ''-'', ''_'', ''.''.'
          example: h100
          maxLength: 63
          type: string
          x-go-name: Value
      required:
      - key
      - effect
      title: KubernetesNodeTaint represents a Kubernetes node taint.
      type: object
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/models
