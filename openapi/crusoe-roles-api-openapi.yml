openapi: 3.2.0
info:
  title: Crusoe Roles API
  version: '1.0'
  description: 'Operations tagged Roles across 2 of this provider''s published API definitions: crusoe-cloud-api-gateway-v1-openapi.json, crusoe-cloud-api-gateway-v1alpha5-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cloud.crusoe.ai/v1
tags:
- name: Roles
paths:
  /iam/roles:
    get:
      operationId: listRoles
      responses:
        '200':
          $ref: '#/components/responses/listRolesResponse'
        '400':
          $ref: '#/components/responses/badReqError'
        '403':
          $ref: '#/components/responses/permissionsError'
        '500':
          $ref: '#/components/responses/serverError'
      summary: Lists role associated with the caller's organization.
      tags:
      - Roles
components:
  responses:
    listRolesResponse:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListRolesResponse'
    serverError:
      description: Error Internal Server
      content:
        application/json:
          schema:
            properties:
              code:
                example: '500'
                type: string
                x-go-name: Code
              message:
                example: internal_error
                type: string
                x-go-name: Message
            required:
            - code
            - message
            type: object
    badReqError:
      description: Error Bad Request
      content:
        application/json:
          schema:
            properties:
              code:
                example: '400'
                type: string
                x-go-name: Code
              message:
                example: bad_request
                type: string
                x-go-name: Message
            required:
            - code
            - message
            type: object
    permissionsError:
      description: Error Permissions
      content:
        application/json:
          schema:
            properties:
              code:
                example: '403'
                type: string
                x-go-name: Code
              message:
                example: unauthorized
                type: string
                x-go-name: Message
            required:
            - code
            - message
            type: object
  schemas:
    ListRolesResponse:
      properties:
        roles:
          items:
            $ref: '#/components/schemas/Role'
          type: array
          x-go-name: Roles
      required:
      - roles
      type: object
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/models
    Role:
      properties:
        allowed_scopes:
          items:
            type: string
          type: array
          x-go-name: AllowedScopes
        description:
          type: string
          x-go-name: Description
        id:
          type: string
          x-go-name: ID
        org_id:
          type: string
          x-go-name: OrgID
        role_name:
          type: string
          x-go-name: RoleName
      required:
      - id
      - role_name
      - allowed_scopes
      - org_id
      - description
      type: object
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/models
