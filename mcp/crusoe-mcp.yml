  hosted: false
  remote_url: null
  note: Local stdio server only — there is no hosted/remote MCP endpoint, so tools/list cannot be probed
    over HTTP. The tool list below is transcribed verbatim from Crusoe's own published documentation,
    which gives names and descriptions but no inputSchema. Live input schemas require running the server
    locally with credentials.
  talks_to: https://api.crusoecloud.com
install:
- client: claude-code
  command: claude mcp add crusoe-cloud -- npx -y @crusoeai/cloud-mcp
- client: claude-desktop
  method: extension bundle
  url: https://docs.crusoecloud.com/downloads/cloud-mcp-latest.mcpb
- client: claude-desktop
  method: manual config
  config: '{"mcpServers":{"crusoe-cloud":{"command":"npx","args":["-y","@crusoeai/cloud-mcp"]}}}'
- client: any
  method: stdio
  note: Type stdio, command npx, args -y @crusoeai/cloud-mcp
requirements:
  node: '>=18'
  credentials: API key pair in ~/.crusoe/config (the standard Crusoe CLI profile)
authentication:
  model: inherited from local CLI profile
  storage: ~/.crusoe/config
  env:
  - CRUSOE_PROFILE
  - CRUSOE_PROJECT_ID
  note: The server does not store credentials separately and never sends them to Crusoe or the AI vendor.
policy:
  read_only: true
  write_operations: disabled by design
  rate_limit: 60 requests per minute (client-side)
  truncation: large lists truncated to 50 items by default
  caveat: Crusoe explicitly warns that the read-only guarantee covers only this server's tools — an agent
    with shell access can still mutate infrastructure by invoking the installed `crusoe` CLI.
