note: >-
  Binds each documented Crusoe Cloud MCP tool to the REST operation(s) that back it. The MCP server is
  stdio-only and its live tools/list (with inputSchema) could not be probed over HTTP, so mappings are
  made by name and semantics against verified operationIds in the published Swagger document — every
  operationId below was grepped out of the spec. Confidence is recorded honestly: `high` where the tool
  name and the operation are unambiguous 1:1, `medium` where the tool fans out or the naming diverges.
  A bound tool's real input contract is that operation's parameters + body in the spec.
