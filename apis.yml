aid: crusoe
name: Crusoe
description: >-
  Crusoe is a vertically integrated "AI factory" company that designs, builds, and operates
  energy-first AI infrastructure, and sells it as Crusoe Cloud — a GPU cloud for training, fine-tuning,
  and inference. The public developer surface is the Crusoe Cloud API Gateway, a REST API at
  api.cloud.crusoe.ai covering virtual machines, instance groups and templates, block storage disks and
  snapshots, S3-compatible object storage, custom images, a container registry, VPC networking and load
  balancers, InfiniBand partitions and NVLink domains, Crusoe Managed Kubernetes and Slurm clusters,
  capacity reservations, IAM role bindings, SCIM/SSO, quotas, audit logs, usage and billing. Alongside
  it, the Intelligence Foundry exposes an OpenAI-compatible Managed Inference API for serverless
  inference, serverless fine-tuning, and self-serve deployments of open models. Crusoe also ships a
  first-party CLI, a Terraform provider, a Go API client, and a read-only Crusoe Cloud MCP server for
  AI assistants. Founded 2018, headquartered in Denver, Colorado.
