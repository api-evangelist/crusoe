aid: crusoe
name: Crusoe
description: >-
  Crusoe is a vertically integrated "AI factory" company that designs, builds, and operates
  energy-first AI infrastructure, and sells it as Crusoe Cloud — a GPU cloud for training, fine-tuning,
  and inference. The public developer surface is the Crusoe Cloud API Gateway, a REST API at
  api.cloud.crusoe.ai covering virtual machines, instance groups and templates, block storage disks and
  snapshots, S3-compatible object storage, custom images, a container registry, VPC networking and load
  balancers, InfiniBand partitions and NVLink domains, Crusoe Managed Kubernetes and Slurm clusters,
  capacity reservations, IAM role bindings, SCIM/SSO, quotas, audit logs, usage and billing. Alongside
  it, the Intelligence Foundry exposes an OpenAI-compatible Managed Inference API for serverless
  inference, serverless fine-tuning, and self-serve deployments of open models. Crusoe also ships a
  first-party CLI, a Terraform provider, a Go API client, and a read-only Crusoe Cloud MCP server for
  AI assistants. Founded 2018, headquartered in Denver, Colorado.
image: https://www.crusoe.ai/favicon.ico
url: https://raw.githubusercontent.com/api-evangelist/crusoe/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.21'
created: '2026-08-04'
modified: '2026-08-04'
tags:
- ai-infrastructure
- cloud-computing
- gpu-compute
- machine-learning
- inference
- kubernetes
- object-storage
- infrastructure-as-a-service
- energy
- mcp
apis:
- name: Crusoe Managed Inference API
  description: >-
    OpenAI-compatible inference API from the Crusoe Intelligence Foundry. Send chat/completions and embeddings
    requests to Crusoe-hosted open models (DeepSeek, Llama, Gemma, GLM, Kimi, Nemotron and others) without
    managing GPU infrastructure, or run reserved-capacity self-serve deployments and LoRA-based serverless
    fine-tuning jobs. Authenticated with an Inference API key issued from the Crusoe Cloud console. The
    endpoint requires credentials for every request, including discovery paths, so no anonymous machine-readable
    contract is published for it.
  humanURL: https://docs.crusoecloud.com/serverless-inference/overview
  baseURL: https://api.inference.crusoecloud.com/v1
  tags:
  - inference
  - machine-learning
  - openai-compatible
  - fine-tuning
  properties:
  - type: Documentation
    url: https://docs.crusoecloud.com/serverless-inference/overview
  - type: GettingStarted
    url: https://docs.crusoecloud.com/quickstart/getting-started-with-serverless-inference
  - type: Pricing
    url: https://www.crusoe.ai/cloud/pricing
  - type: Authentication
    url: authentication/crusoe-authentication.yml
- name: Crusoe Cloud MCP Server
  description: >-
    First-party, read-only Model Context Protocol server published by Crusoe as the npm package @crusoeai/cloud-mcp
    and as a downloadable Claude Desktop extension bundle. Runs over stdio, inherits credentials from
    the local ~/.crusoe/config CLI profile, and exposes read-only tools for identity, projects, capacities,
    VMs, instance groups and templates, disks, snapshots, images, custom images, VPC networks, subnets,
    firewall rules, load balancers, Kubernetes clusters and node pools, audit logs, quotas, GPU tracking,
    usage, and a resource-relationship topology graph. All write operations are disabled by design; a
    client-side limit of 60 requests per minute is enforced. Currently in preview.
  humanURL: https://docs.crusoecloud.com/reference/mcp-server
  baseURL: https://api.crusoecloud.com/v1
  tags:
  - mcp
  - agent-native
  - ai-infrastructure
  - cloud-computing
  properties:
  - type: MCPServer
    url: mcp/crusoe-mcp.yml
  - type: ToolCrosswalk
    url: mcp/crusoe-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.crusoecloud.com/reference/mcp-server
  - type: Packages
    url: https://www.npmjs.com/package/@crusoeai/cloud-mcp
