- name: Crusoe Managed Inference API
  description: >-
    OpenAI-compatible inference API from the Crusoe Intelligence Foundry. Send chat/completions and
    embeddings requests to Crusoe-hosted open models (DeepSeek, Llama, Gemma, GLM, Kimi, Nemotron and
    others) without managing GPU infrastructure, or run reserved-capacity self-serve deployments and
    LoRA-based serverless fine-tuning jobs. Authenticated with an Inference API key issued from the
    Crusoe Cloud console. The endpoint requires credentials for every request, including discovery
    paths, so no anonymous machine-readable contract is published for it.
  humanURL: https://docs.crusoecloud.com/serverless-inference/overview
  baseURL: https://api.inference.crusoecloud.com/v1
  tags:
  - inference
  - machine-learning
  - openai-compatible
  - fine-tuning
  properties:
  - type: Documentation
    url: https://docs.crusoecloud.com/serverless-inference/overview
  - type: GettingStarted
    url: https://docs.crusoecloud.com/quickstart/getting-started-with-serverless-inference
  - type: Pricing
    url: https://www.crusoe.ai/cloud/pricing
  - type: Authentication
    url: authentication/crusoe-authentication.yml
- name: Crusoe Cloud MCP Server
  description: >-
    First-party, read-only Model Context Protocol server published by Crusoe as the npm package
    @crusoeai/cloud-mcp and as a downloadable Claude Desktop extension bundle. Runs over stdio, inherits
    credentials from the local ~/.crusoe/config CLI profile, and exposes read-only tools for identity,
    projects, capacities, VMs, instance groups and templates, disks, snapshots, images, custom images,
    VPC networks, subnets, firewall rules, load balancers, Kubernetes clusters and node pools, audit
    logs, quotas, GPU tracking, usage, and a resource-relationship topology graph. All write operations
    are disabled by design; a client-side limit of 60 requests per minute is enforced. Currently in
    preview.
  humanURL: https://docs.crusoecloud.com/reference/mcp-server
  baseURL: https://api.crusoecloud.com/v1
  tags:
  - mcp
  - agent-native
  - ai-infrastructure
  - cloud-computing
  properties:
  - type: MCPServer
    url: mcp/crusoe-mcp.yml
  - type: ToolCrosswalk
    url: mcp/crusoe-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.crusoecloud.com/reference/mcp-server
  - type: Packages
    url: https://www.npmjs.com/package/@crusoeai/cloud-mcp
