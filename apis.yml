apis:
- name: Crusoe Cloud API Gateway
  description: >-
    REST API exposing all publicly available Crusoe Cloud endpoints — compute (VMs, instance groups,
    instance templates, images, custom images), storage (disks, snapshots, S3 buckets and keys),
    networking (VPC networks, subnets, firewall rules, load balancers, IB partitions, NVLink domains),
    orchestration (Crusoe Managed Kubernetes clusters and node pools, Slurm clusters and nodesets,
    AutoClusters), the Intelligence Foundry, container registry, identity and access (role bindings,
    SSH keys, tokens, MFA, SSO, SCIM), and organization management (projects, quotas, usage, billing,
    audit logs). Requests are authenticated with an HMAC-SHA256 signed Authorization header plus an
    X-Crusoe-Timestamp header. Current version is v1; v1alpha5 remains published as the preview track.
  humanURL: https://docs.crusoecloud.com/reference/api/
  baseURL: https://api.cloud.crusoe.ai/v1
  tags:
  - ai-infrastructure
  - cloud-computing
  - gpu-compute
  - kubernetes
  - object-storage
  - infrastructure-as-a-service
